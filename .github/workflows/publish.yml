name: Publish bundle

# Hourly: build the next vulnerability bundle from the previous release and
# what the sources changed since, sign it, verify it and publish it as a
# GitHub Release of THIS repository, with this repository's own token. The
# code is openctemio/vulnfeed at the pinned VULNFEED_REF.
#
# Three jobs on purpose. "preflight" checks the key set and that the signing
# key is set, before any multi-hour build. "build" talks to the sources and
# never sees the signing key. "publish" runs in the protected "publish"
# environment (only main can deploy to it), holds the signing key and
# nothing else, and only signs, verifies and uploads what "build" produced.

on:
  schedule:
    - cron: "17 2 * * *" # daily: tests too
    - cron: "17 0,1,3-23 * * *" # hourly
  workflow_dispatch:
    inputs:
      allow_mass_change:
        description: "Publish even though the removal guard refused (only after checking the source)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  # The collector, as a full commit SHA of openctemio/vulnfeed or one of its
  # release tags (vX.Y.Z). Moved by pull request only.
  VULNFEED_REF: 8b951fddd2684b5a4f3ec331d058d949628cfda9
  # Where the sequence continues from on the very first run, when this
  # repository has no release yet.
  LEGACY_REPO: openctemio/vulnfeed

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Signing key set?
        env:
          VULNFEED_SIGNING_KEY: ${{ secrets.VULNFEED_SIGNING_KEY }}
        run: |
          if [ -z "$VULNFEED_SIGNING_KEY" ]; then
            echo "::error::The secret VULNFEED_SIGNING_KEY is not set in the 'publish' environment, so nothing can be signed and nothing is published. Set it as described in keys/README.md."
            exit 1
          fi
      - name: Key set valid?
        run: |
          python3 - <<'PY'
          import base64, json, sys, datetime
          p = json.loads(base64.b64decode(json.load(open("keys/keyset.dsse.json"))["payload"]))
          end = datetime.datetime.fromisoformat(p["not_after"].replace("Z", "+00:00"))
          left = (end - datetime.datetime.now(datetime.timezone.utc)).days
          want = open("keys/root-keyid.txt").read().strip()
          if p["root_keyid"] != want:
              sys.exit("::error::the key set names a different root than keys/root-keyid.txt")
          if left < 0:
              sys.exit("::error::the key set expired %d days ago: rotate it (keys/README.md)" % -left)
          if left < 30:
              print("::warning::the key set ends in %d days: rotate it (keys/README.md)" % left)
          print("key set version %s, %d days left" % (p["version"], left))
          PY

  build:
    needs: preflight
    runs-on: ubuntu-latest
    # A build from scratch reads all of NVD: without an NVD API key that takes
    # about 4 hours. Incremental builds take minutes. 340 stays under the
    # hosted runner's 6 h job limit.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openctemio/vulnfeed
          ref: ${{ env.VULNFEED_REF }}
          path: src
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache: false
      - name: Test
        if: github.event_name != 'schedule' || github.event.schedule == '17 2 * * *'
        run: cd src && go test ./...
      - name: Build the CLI
        run: cd src && go build -trimpath -ldflags "-X main.version=${VULNFEED_REF::12}" -o ../vulnfeed ./cmd/vulnfeed
      - name: Download the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          for repo in "$GITHUB_REPOSITORY" "$LEGACY_REPO"; do
            if gh release view --repo "$repo" >/dev/null 2>&1; then
              echo "previous release read from $repo"
              # Every file: the build reads the previous snapshot and delta
              # manifests and the chunks they name, not only the snapshot files.
              gh release download --repo "$repo" --dir prev
              echo "PREV=--prev=prev" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          # Building from scratch would restart the sequence at 1, and
          # platforms refuse a lower sequence than they have applied.
          echo "::error::no previous release in $GITHUB_REPOSITORY or $LEGACY_REPO: refusing to restart the sequence"
          exit 1
      - name: Build the bundle
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # Read-only token of this run: a higher GitHub API rate limit for
          # the CVE List. It reads public data only.
          GITHUB_TOKEN: ${{ github.token }}
          MASS: ${{ inputs.allow_mass_change && '--allow-mass-change' || '' }}
        run: ./vulnfeed build --out out --root-key-id "$(cat keys/root-keyid.txt)" $PREV $MASS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: out/
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openctemio/vulnfeed
          ref: ${{ env.VULNFEED_REF }}
          path: src
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache: false
      - name: Build the CLI
        run: cd src && go build -trimpath -o ../vulnfeed ./cmd/vulnfeed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: out
      - name: Sign
        env:
          VULNFEED_SIGNING_KEY: ${{ secrets.VULNFEED_SIGNING_KEY }}
        run: |
          [ -n "$VULNFEED_SIGNING_KEY" ] || { echo "::error::VULNFEED_SIGNING_KEY is not set: refusing to publish unsigned"; exit 1; }
          ./vulnfeed sign --dir out --keyset keys/keyset.dsse.json --root-key-id "$(cat keys/root-keyid.txt)"
      - name: Verify as the platform does
        run: ./vulnfeed verify --dir out --root-key-id "$(cat keys/root-keyid.txt)"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python3 -c 'import json,base64,sys; e=json.load(open("out/latest.dsse.json")); print(json.loads(base64.b64decode(e["payload"]))["tag"])')"
          cat > notes.md <<'NOTES'
          Vulnerability bundle for OpenCTEM, published hourly: a signed snapshot and the delta from the previous release. Verification and use: see the README.

          This product uses data from the NVD API but is not endorsed or certified by the NVD.
          CISA Known Exploited Vulnerabilities Catalog, a work of the U.S. government. EPSS scores from the Forum of Incident Response and Security Teams (https://www.first.org/epss), used with attribution.
          CVE records from the CVE List of the CVE Program. CVE is a registered trademark of The MITRE Corporation.
          See NOTICE for the terms of every source.
          NOTES
          # A draft first (platforms read releases/latest, which never names
          # a draft). The script resumes a draft, skips chunks already there,
          # drops assets of an older build, and publishes when all are in.
          TITLE="$tag ($(date -u '+%Y-%m-%d %H:%M') UTC)" bash src/.github/scripts/publish-release.sh "$tag" out
      - name: Keep the last 72 releases (three days)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[72:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
